sops:
- id: SOP-01
  title: Import Clearance Standard Operating Procedure
  version: v3.2
  effective_date: '2025-09-01'
  filename: SOP-01_Import_Clearance.pdf
  sections:
  - number: '1'
    title: Purpose and Scope
    clauses:
    - number: '1.1'
      title: Purpose
      gist: Defines the mandatory steps for sea import clearance handled by the Import Operations team.
      id: SOP-01-C1.1
    - number: '1.2'
      title: Scope
      gist: Applies to all FCL and LCL sea imports where Meridian acts as forwarder or NVOCC; air imports are covered by SOP-06.
      id: SOP-01-C1.2
    id: SOP-01-S1
  - number: '2'
    title: Roles and Responsibilities
    clauses:
    - number: '2.1'
      title: Import Operator
      gist: Owns the file from pre-alert to delivery; single point of contact for consignee, broker, carrier, trucker.
      id: SOP-01-C2.1
    - number: '2.2'
      title: Import Team Lead
      gist: Approves exceptions, signs off on cost absorption up to USD 2,000, receives escalations.
      id: SOP-01-C2.2
    - number: '2.3'
      title: Documentation Clerk
      gist: Issues House B/L, maintains document register, archives originals.
      id: SOP-01-C2.3
    id: SOP-01-S2
  - number: '3'
    title: Pre-arrival
    clauses:
    - number: '3.1'
      title: Pre-alert review
      gist: Operator reviews the pre-alert within 1 working day of receipt and confirms HBL/MBL data match.
      id: SOP-01-C3.1
    - number: '3.2'
      title: Arrival Notice
      gist: Arrival Notice is sent to consignee no later than 3 working days before ETA; it must quote MBL, HBL, container,
        vessel/voyage, ETA and free time.
      id: SOP-01-C3.2
    - number: '3.3'
      title: Document collection
      gist: Commercial invoice, packing list and C/O (if preferential) are requested from the consignee at the time of the
        Arrival Notice; see SOP-02 for the checklist.
      id: SOP-01-C3.3
    id: SOP-01-S3
  - number: '4'
    title: Customs Declaration
    clauses:
    - number: '4.1'
      title: Broker instruction
      gist: A complete document set is forwarded to the appointed customs broker at least 2 working days before ETA.
      id: SOP-01-C4.1
    - number: '4.2'
      title: HS code verification
      gist: Operator cross-checks the broker's proposed HS code against the consignee's import history; any change is confirmed
        in writing with the consignee before filing.
      id: SOP-01-C4.2
    - number: '4.3'
      title: Duty and tax payment
      gist: Duty is paid by the consignee directly unless a disbursement is pre-approved by Accounting.
      id: SOP-01-C4.3
    id: SOP-01-S4
  - number: '5'
    title: Inspection and Release
    clauses:
    - number: '5.1'
      title: Inspection notice
      gist: If customs selects the shipment for physical inspection, the operator informs the consignee within 1 working day
        and records the inspection in the file.
      id: SOP-01-C5.1
    - number: '5.2'
      title: Delivery Order
      gist: D/O is requested from the carrier only after customs release AND confirmed O/BL surrender or telex release.
      id: SOP-01-C5.2
    - number: '5.3'
      title: Trucking booking
      gist: Trucking is booked at least 1 working day before planned pick-up and the consignee is given the delivery slot
        in writing.
      id: SOP-01-C5.3
    id: SOP-01-S5
  - number: '6'
    title: File Closure
    clauses:
    - number: '6.1'
      title: Proof of delivery
      gist: Signed POD is obtained within 3 working days of delivery and attached to the file.
      id: SOP-01-C6.1
    - number: '6.2'
      title: Invoicing handover
      gist: Cost sheet handed to Accounting within 5 working days of delivery.
      id: SOP-01-C6.2
    id: SOP-01-S6
- id: SOP-02
  title: Import Document Checklist and B/L Handling
  version: v2.0
  effective_date: '2025-06-15'
  filename: SOP-02_Document_Checklist_BL_Handling.pdf
  sections:
  - number: '1'
    title: Mandatory Document Set
    clauses:
    - number: '1.1'
      title: Checklist
      gist: 'Table of required documents per cargo type: commercial invoice, packing list, B/L, C/O, import licence (medical
        devices), health certificate (food).'
      id: SOP-02-C1.1
    - number: '1.2'
      title: Completeness check
      gist: Operator ticks the checklist in the file before instructing the broker; missing items are chased with the consignee
        in writing.
      id: SOP-02-C1.2
    id: SOP-02-S1
  - number: '2'
    title: Bill of Lading
    clauses:
    - number: '2.1'
      title: Master vs House
      gist: MBL is issued by the carrier to Meridian; HBL is issued by Meridian to the consignee. Both numbers appear on every
        mail subject about the shipment.
      id: SOP-02-C2.1
    - number: '2.2'
      title: Original B/L
      gist: Where an original B/L is issued, all three originals or one duly endorsed original must be surrendered before
        cargo release.
      id: SOP-02-C2.2
    - number: '2.3'
      title: Telex release / Sea waybill
      gist: Telex release confirmation from the carrier replaces O/BL surrender; a screenshot of the confirmation is filed.
      id: SOP-02-C2.3
    - number: '2.4'
      title: Release confirmation before D/O
      gist: No D/O request is sent to the carrier until O/BL surrender or telex release is confirmed and recorded in the file.
      id: SOP-02-C2.4
    id: SOP-02-S2
  - number: '3'
    title: Amendments
    clauses:
    - number: '3.1'
      title: B/L correction
      gist: Any B/L amendment after vessel departure requires the shipper's written request and consignee's acknowledgement;
        amendment fees are quoted to the requesting party.
      id: SOP-02-C3.1
    - number: '3.2'
      title: Manifest correction
      gist: Manifest corrections at destination must be filed before the vessel's ATA; late corrections are escalated to the
        Team Lead.
      id: SOP-02-C3.2
    id: SOP-02-S3
  - number: '4'
    title: Archiving
    clauses:
    - number: '4.1'
      title: Retention
      gist: All import documents are retained for 5 years in the document management system.
      id: SOP-02-C4.1
    id: SOP-02-S4
- id: SOP-03
  title: Demurrage and Detention Avoidance and Free-time Policy
  version: v4.1
  effective_date: '2025-11-01'
  filename: SOP-03_Demurrage_Detention_Freetime.pdf
  sections:
  - number: '1'
    title: Definitions
    clauses:
    - number: '1.1'
      title: Free time
      gist: The number of calendar days from container discharge during which no demurrage is charged by the carrier.
      id: SOP-03-C1.1
    - number: '1.2'
      title: Demurrage vs Detention
      gist: Demurrage accrues while the container is inside the terminal; detention accrues after gate-out until empty return.
      id: SOP-03-C1.2
    id: SOP-03-S1
  - number: '2'
    title: Standard Free Time
    clauses:
    - number: '2.1'
      title: Contract free time table
      gist: 'Table: Hanseatic Marine Lines 7 days dry / 5 days reefer; Orient Container Line 7 days dry / 5 days reefer; Pacific
        Star Shipping 7 days dry / 4 days reefer; Blue Harbor Foods contract adds 3 days on all carriers.'
      id: SOP-03-C2.1
    - number: '2.2'
      title: Recording
      gist: Free-time expiry date is recorded in the file on the day the Arrival Notice is issued.
      id: SOP-03-C2.2
    id: SOP-03-S2
  - number: '3'
    title: Monitoring
    clauses:
    - number: '3.1'
      title: Daily watch list
      gist: Operator reviews all containers with free time expiring within 3 days every morning.
      id: SOP-03-C3.1
    - number: '3.2'
      title: Consignee reminder
      gist: Consignee is reminded in writing 3 working days before free-time expiry if customs release or pick-up is not yet
        confirmed.
      id: SOP-03-C3.2
    id: SOP-03-S3
  - number: '4'
    title: Extension and Charges
    clauses:
    - number: '4.1'
      title: Extension request
      gist: Free-time extension is requested from the carrier's D&D desk in writing when a delay is foreseeable.
      id: SOP-03-C4.1
    - number: '4.2'
      title: Extension timing
      gist: The extension request must be sent no later than 2 working days before free time expires; requests after expiry
        are generally refused by carriers.
      id: SOP-03-C4.2
    - number: '4.3'
      title: Charge allocation
      gist: Demurrage caused by consignee document delay is billed to the consignee; demurrage caused by Meridian's error
        is absorbed with Team Lead approval and recorded as a cost-absorption decision.
      id: SOP-03-C4.3
    - number: '4.4'
      title: Dispute
      gist: D&D invoices are disputed with the carrier within 7 days of receipt when the charge contradicts the recorded free
        time.
      id: SOP-03-C4.4
    id: SOP-03-S4
  - number: '5'
    title: Empty Return
    clauses:
    - number: '5.1'
      title: Return deadline
      gist: Trucker confirms empty return date in writing; operator records the return date to close detention exposure.
      id: SOP-03-C5.1
    id: SOP-03-S5
- id: SOP-04
  title: Exception and Escalation Policy
  version: v2.3
  effective_date: '2025-10-01'
  filename: SOP-04_Exception_Escalation.pdf
  sections:
  - number: '1'
    title: Exception Categories
    clauses:
    - number: '1.1'
      title: Categories
      gist: 'Table of exception categories: vessel delay > 3 days, customs inspection, document discrepancy, demurrage/detention
        exposure, cargo damage or shortage, regulatory hold.'
      id: SOP-04-C1.1
    - number: '1.2'
      title: Severity
      gist: 'Severity 1: potential cost over USD 500 or delivery delay over 5 days; Severity 2: all other exceptions.'
      id: SOP-04-C1.2
    id: SOP-04-S1
  - number: '2'
    title: Reporting
    clauses:
    - number: '2.1'
      title: Consignee notification
      gist: Consignee is informed of any exception within 1 working day of Meridian becoming aware of it.
      id: SOP-04-C2.1
    - number: '2.2'
      title: Incident record
      gist: Each exception is logged in the file with date detected, cause, expected impact and owner.
      id: SOP-04-C2.2
    id: SOP-04-S2
  - number: '3'
    title: Escalation
    clauses:
    - number: '3.1'
      title: 48-hour escalation
      gist: Severity 1 exceptions are escalated to the Import Team Lead in writing within 48 hours of detection.
      id: SOP-04-C3.1
    - number: '3.2'
      title: Management escalation
      gist: Exceptions with potential cost over USD 2,000 or a claim against Meridian are escalated to the Operations Manager
        by the Team Lead.
      id: SOP-04-C3.2
    - number: '3.3'
      title: Decision recording
      gist: Every escalation ends with a recorded decision stating what was decided, by whom and on which date.
      id: SOP-04-C3.3
    id: SOP-04-S3
  - number: '4'
    title: Claims
    clauses:
    - number: '4.1'
      title: Claim notice
      gist: Cargo damage or shortage noted at delivery is notified to the carrier in writing within 3 days of delivery to
        preserve recourse.
      id: SOP-04-C4.1
    - number: '4.2'
      title: Evidence
      gist: Photos, delivery receipt remarks and a survey report (if value over USD 10,000) are collected before any settlement
        discussion.
      id: SOP-04-C4.2
    id: SOP-04-S4
- id: SOP-05
  title: Customs Broker and Vendor Management Policy
  version: v1.4
  effective_date: '2025-04-01'
  filename: SOP-05_Broker_Vendor_Management.pdf
  sections:
  - number: '1'
    title: Approved Vendors
    clauses:
    - number: '1.1'
      title: Approved list
      gist: Only brokers and truckers on the approved vendor list may be instructed; the list is maintained by the Operations
        Manager.
      id: SOP-05-C1.1
    - number: '1.2'
      title: Broker allocation
      gist: 'Table: Harbor Gate Customs Brokerage handles Daehan Precision and Seoul Medica; Kim & Park Customs Services handles
        Blue Harbor Foods (food and agricultural).'
      id: SOP-05-C1.2
    id: SOP-05-S1
  - number: '2'
    title: Instruction and Quotation
    clauses:
    - number: '2.1'
      title: Written instruction
      gist: Brokers and truckers are instructed by e-mail with the HBL number in the subject; verbal instructions are confirmed
        in writing the same day.
      id: SOP-05-C2.1
    - number: '2.2'
      title: Rate validity
      gist: Vendor rates are agreed annually; any charge outside the rate sheet requires a quotation approved by the Team
        Lead before the service is performed.
      id: SOP-05-C2.2
    id: SOP-05-S2
  - number: '3'
    title: Performance Review
    clauses:
    - number: '3.1'
      title: Quarterly review
      gist: Operations Manager reviews broker clearance lead time and trucker on-time rate each quarter.
      id: SOP-05-C3.1
    - number: '3.2'
      title: Non-conformance
      gist: Repeated errors by a vendor are recorded and discussed with the vendor; two recorded non-conformances in a quarter
        trigger a review of the allocation.
      id: SOP-05-C3.2
    id: SOP-05-S3
  - number: '4'
    title: Invoices
    clauses:
    - number: '4.1'
      title: Invoice check
      gist: Vendor invoices are checked against the instruction and the rate sheet by the operator before Accounting pays
        them.
      id: SOP-05-C4.1
    id: SOP-05-S4
